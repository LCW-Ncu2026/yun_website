<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的云端微门户</title>
    <link rel="stylesheet" href="styles/style.css">
    <!-- 引入将网页生成图片的第三方库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="main-container">
        <!-- 左侧：信息输入区 -->
        <div class="input-section">
            <h2>填写你的信息</h2>
            <label>上传头像：<input type="file" id="avatarInput" accept="image/*"></label>
            <input type="text" id="nameInput" placeholder="你的姓名 (例如: 刘楚威)">
            <input type="text" id="schoolInput" placeholder="学校与专业 (例如: 南昌大学 软件工程)">
            <input type="text" id="skillsInput" placeholder="技能标签 (用逗号隔开, 例如: C语言,Linux,Git)">
            <textarea id="bioInput" placeholder="简短的个人简介..."></textarea>
            
            <h3>联系方式</h3>
            <input type="text" id="qqInput" placeholder="QQ号">
            <input type="text" id="wechatInput" placeholder="微信号">
            <input type="text" id="emailInput" placeholder="邮箱地址">
            <input type="text" id="githubInput" placeholder="GitHub主页链接">

            <button id="downloadBtn" class="action-btn">保存名片为海报 📸</button>
        </div>

        <!-- 右侧：名片预览区 (毛玻璃效果) -->
        <div class="preview-section">
            <!-- 这个 div 就是我们要截图的区域 -->
            <div class="glass-card" id="cardToExport">
                < img id="avatarPreview" src="images/firefox-icon.png" alt="头像">
                <h1 id="namePreview">你的姓名</h1>
                <p id="schoolPreview" class="subtitle">学校与专业</p >
                
                <div class="tags" id="skillsPreview">
                    <span>技能标签</span>
                </div>

                <p id="bioPreview" class="bio">这里显示你的个人简介...</p >
                
                <div class="contacts" id="contactsPreview">
                    <p>📧 邮箱: 待填写</p >
                    <p>🐙 GitHub: 待填写</p >
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
