<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的网站</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
      color: #ffffff;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 40px;
      color: #a0a0b0;
    }

    .bouncing-btn {
      display: inline-block;
      padding: 16px 48px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      animation: bounce 1.5s ease-in-out infinite;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .bouncing-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
      animation-play-state: paused;
    }

    .bouncing-btn:active {
      transform: translateY(0);
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-15px);
      }
      50% {
        transform: translateY(0);
      }
      70% {
        transform: translateY(-8px);
      }
      85% {
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>欢迎来到我的网站</h1>
    <p>这是一个使用 Nginx 部署的静态网页</p>
    <button class="bouncing-btn" onclick="alert('你好！感谢点击！')">
      点击我
    </button>
  </div>
</body>
</html>
